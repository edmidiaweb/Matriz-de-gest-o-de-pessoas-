<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Gestão Operacional</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>Sistema de Gestão Operacional</h1>

    <button onclick="mostrarFormulario()">
      Criar Registro
    </button>

    <div id="formulario" class="oculto">

      <h2>Novo Registro</h2>

      <label>Funcionário</label>

      <select id="funcionario">

        <option value="">
          Selecione
        </option>

        <option value="Lucas">
          Lucas
        </option>

        <option value="Gamarra">
          Gamarra
        </option>

        <option value="Mateus">
          Mateus
        </option>

        <option value="Luis">
          Luis
        </option>

      </select>

      <label>Atividade Realizada</label>

      <input
        type="text"
        id="atividade"
        placeholder="Digite a atividade"
      >

      <label>Uso de EPIs</label>

      <select id="epis" onchange="mostrarObs('epis')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-epis"
        class="oculto"
        placeholder="Observação sobre EPIs"
      ></textarea>

      <label>Organização</label>

      <select id="organizacao" onchange="mostrarObs('organizacao')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-organizacao"
        class="oculto"
        placeholder="Observação sobre organização"
      ></textarea>

      <label>Produtividade</label>

      <select id="produtividade" onchange="mostrarObs('produtividade')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-produtividade"
        class="oculto"
        placeholder="Observação sobre produtividade"
      ></textarea>

      <label>Abandono de Área</label>

      <select id="abandono">

        <option value="Não">
          Não
        </option>

        <option value="Sim">
          Sim
        </option>

      </select>

      <label>Cumprimento de Regras</label>

      <select id="regras" onchange="mostrarObs('regras')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-regras"
        class="oculto"
        placeholder="Observação sobre regras"
      ></textarea>

      <label>Iniciativa</label>

      <select id="iniciativa" onchange="mostrarObs('iniciativa')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-iniciativa"
        class="oculto"
        placeholder="Observação sobre iniciativa"
      ></textarea>

      <label>Comunicação</label>

      <select id="comunicacao" onchange="mostrarObs('comunicacao')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-comunicacao"
        class="oculto"
        placeholder="Observação sobre comunicação"
      ></textarea>

      <label>Confiabilidade</label>

      <select id="confiabilidade" onchange="mostrarObs('confiabilidade')">

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-confiabilidade"
        class="oculto"
        placeholder="Observação sobre confiabilidade"
      ></textarea>

      <label>Pontualidade ao Chegar</label>

      <select
        id="pontualidade-chegada"
        onchange="mostrarObs('pontualidade-chegada')"
      >

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-pontualidade-chegada"
        class="oculto"
        placeholder="Observação sobre chegada"
      ></textarea>

      <label>Pontualidade ao Sair</label>

      <select
        id="pontualidade-saida"
        onchange="mostrarObs('pontualidade-saida')"
      >

        <option value="Bom">
          Bom
        </option>

        <option value="Regular">
          Regular
        </option>

        <option value="Ruim">
          Ruim
        </option>

      </select>

      <textarea
        id="obs-pontualidade-saida"
        class="oculto"
        placeholder="Observação sobre saída"
      ></textarea>

      <label>Observações Gerais</label>

      <textarea
        id="observacao"
        placeholder="Digite observações gerais"
      ></textarea>

      <button onclick="adicionarRegistro()">
        Salvar Registro
      </button>

    </div>

    <hr>

    <h2>Ocorrências</h2>

    <ul id="lista"></ul>

    <hr>

    <h2>Serviços Pendentes</h2>

    <label>Descrição da Pendência</label>

    <input
      type="text"
      id="pendencia"
      placeholder="Digite a pendência"
    >

    <label>Prioridade</label>

    <select id="prioridade">

      <option value="Baixa">
        Baixa
      </option>

      <option value="Média">
        Média
      </option>

      <option value="Alta">
        Alta
      </option>

    </select>

    <label>Observação da Pendência</label>

    <textarea
      id="obs-pendencia"
      placeholder="Digite observações"
    ></textarea>

    <button onclick="adicionarPendencia()">
      Adicionar Pendência
    </button>

    <ul id="lista-pendencias"></ul>

    <hr>

    <button onclick="gerarRelatorio()">
      Gerar Relatório
    </button>

    <button onclick="limparRelatorio()">
      Limpar Relatório
    </button>

    <button onclick="limparRegistros()">
      Limpar Tudo
    </button>

    <hr>

    <label>Escolher WhatsApp</label>

    <select id="numero-whatsapp">

      <option value="5513996305218">
        13 99630-5218
      </option>

      <option value="5511999086331">
        11 99908-6331
      </option>

    </select>

    <button onclick="enviarWhatsApp()">
      Enviar WhatsApp
    </button>

    <button onclick="enviarEmail()">
      Enviar E-mail
    </button>

    <button onclick="baixarPDF()">
      Baixar PDF
    </button>

    <hr>

    <textarea
      id="relatorio"
      rows="20"
      readonly
      placeholder="O relatório será exibido aqui..."
    ></textarea>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="script.js"></script>

</body>

</html>
