<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestão Operacional</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>Gestão Operacional</h1>

    <button class="btn-principal" onclick="mostrarFormulario()">
      Criar Registro
    </button>

    <div id="formulario" class="formulario oculto">

      <input
        type="text"
        id="funcionario"
        placeholder="Nome do funcionário"
      >

      <input
        type="text"
        id="atividade"
        placeholder="Atividade realizada"
      >

      <h2>Avaliação Operacional</h2>

      <div class="categoria">

        <label>Uso de EPIs</label>

        <select id="epis">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <div class="categoria">

        <label>Organização</label>

        <select id="organizacao">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <div class="categoria">

        <label>Produtividade</label>

        <select id="produtividade">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <div class="categoria">

        <label>Abandono de Área</label>

        <select id="abandono">
          <option value="Sim">Sim</option>
          <option value="Nao">Nao</option>
          <option value=""></option>
        </select>

      </div>

      <div class="categoria">

        <label>Cumprimento de Regras</label>

        <select id="regras">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <div class="categoria">

        <label>Iniciativa</label>

        <select id="iniciativa">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <div class="categoria">

        <label>Comunicação</label>

        <select id="comunicacao">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <div class="categoria">

        <label>Confiabilidade</label>

        <select id="confiabilidade">
          <option value="Ótimo">Ótimo</option>
          <option value="Bom">Bom</option>
          <option value="Ruim">Ruim</option>
        </select>

      </div>

      <textarea
        id="observacao"
        placeholder="Observações"
      ></textarea>

      <button onclick="adicionarRegistro()">
        Salvar Registro
      </button>

    </div>

    <button onclick="limparRegistros()">
      Limpar Registros
    </button>

    <h2>Ocorrências do Dia</h2>

    <ul id="lista"></ul>

    <button onclick="gerarRelatorio()">
      Gerar Relatório
    </button>

    <button onclick="limparRelatorio()">
      Limpar Relatório
    </button>

    <button onclick="enviarWhatsApp()">
      Enviar no WhatsApp
    </button>

    <textarea
      id="relatorio"
      readonly
      placeholder="O relatório aparecerá aqui..."
    ></textarea>

  </div>

  <script src="script.js"></script>

</body>

</html>
